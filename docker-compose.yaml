services:
  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_NGINX}
    ports:
      - '8080:80'
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - node
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pidof nginx && netstat -an | grep :80" ]
      interval: 10s
      timeout: 5s
      retries: 3

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PHP}
    volumes:
      - ./:/var/www/html
    networks:
      - internal
    restart: unless-stopped
    environment:
      - PHP_IDE_CONFIG=serverName=Laravel
    healthcheck:
      test: [ "CMD-SHELL", "php-fpm -t && test -d /var/www/html/vendor" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  db:
    image: postgres:15
    container_name: ${CONTAINER_POSTGRES}
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_REDIS}
    ports:
      - '6379:6379'
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  node:
    build:
      context: .
      dockerfile: ./docker/node/Dockerfile
    container_name: ${CONTAINER_NODE}
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    ports:
      - '5173:5173'
      - '5174:5174'
    environment:
      - HOST=0.0.0.0
      - VITE_HOST=0.0.0.0
    command: ["npm", "run", "dev"]
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
